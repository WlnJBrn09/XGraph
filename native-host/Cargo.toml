[package]
name = "xgraph-native"
version = "0.1.0"
edition = "2021"
description = "XGraph — native system WebView host with local Rust backend"
license = "MIT"
authors = ["XGraph"]

[[bin]]
name = "xgraph-native"
path = "src/main.rs"

[dependencies]
anyhow = "1"
rand = "0.8"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
tao = "0.32"
wry = "0.50"


[dev-dependencies]
tempfile = "3"
