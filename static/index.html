<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="description" content="XGraph — local drawing editor"/><meta name="theme-color" content="#ffffff"/><title>Untitled drawing — XGraph</title><script>try{document.documentElement.dataset.theme=localStorage.getItem('xgraph-theme')||((matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light')}catch(e){document.documentElement.dataset.theme='light'}</script><link rel="icon" href="assets/logo.svg" type="image/svg+xml"/><link rel="stylesheet" href="style.css"/><link rel="stylesheet" href="editor.css"/></head>
<body data-product="XGraph" data-slug="xgraph" data-kind="drawing"><input type="file" id="file-input" class="sr-only" accept=".svg,.odg,.json"/><input type="file" id="image-input" class="sr-only" accept="image/png,image/jpeg,image/webp,image/gif"/>
<div id="app"><aside id="sidebar" class="liquid-glass" aria-label="Library"><div class="sidebar-brand"><img class="sidebar-logo" src="assets/logo.svg" alt=""/><div><div class="brand-name">XGraph</div><div class="brand-sub">Vector drawings</div></div></div><div class="sidebar-actions"><button class="sidebar-btn pressable" id="new-btn"><span class="material-symbols-outlined" aria-hidden="true">draw</span> New Drawing</button><button class="sidebar-btn pressable" id="open-btn"><span class="material-symbols-outlined" aria-hidden="true">folder_open</span> Open File</button></div><div class="tabs-head"><span>Library</span><button class="icon-btn" id="refresh-btn" aria-label="Refresh library" title="Refresh library"><span class="material-symbols-outlined" aria-hidden="true">refresh</span></button></div><div class="file-hint">SVG · ODG · JSON</div><div id="doc-list" class="doc-list" role="list"></div></aside>
<div id="main-col"><header id="header" class="liquid-glass"><div class="header-top"><div class="header-left"><img class="app-logo" src="assets/logo.svg" alt="XGraph"/><div class="title-row"><div id="doc-title" class="doc-title" contenteditable="true" role="textbox" spellcheck="false" aria-label="Document title">Untitled drawing</div><button id="star-btn" class="icon-btn pressable" aria-label="Star document" title="Star" aria-pressed="false"><span class="material-symbols-outlined" aria-hidden="true">star</span></button><span id="status" class="status-pill" aria-live="polite">Ready</span></div></div><div class="header-actions"><button id="theme-btn" class="glass-btn pressable" aria-label="Toggle theme" title="Toggle theme"><span class="material-symbols-outlined" aria-hidden="true">dark_mode</span></button><button id="print-btn" class="glass-btn pressable" title="Print or save PDF"><span class="material-symbols-outlined" aria-hidden="true">print</span> Print</button><button id="save-btn" class="glass-btn pressable" title="Save (Ctrl+S)"><span class="material-symbols-outlined" aria-hidden="true">save</span> Save</button><label class="sr-only" for="export-format">Export format</label><select id="export-format" class="glass-btn" aria-label="Export format"><option value="odg">OpenDocument Drawing (.odg)</option><option value="svg">SVG drawing (.svg)</option><option value="png">PNG image (.png)</option><option value="json">Editable JSON (.json)</option></select><button id="export-btn" class="glass-btn primary pressable">Export</button></div></div><div class="toolbar-area"><div class="toolbar-pill liquid-glass liquid-glass--light" role="toolbar" aria-label="Editing tools"><button class="tool-btn pressable" data-tool="select">↖ Select</button><button class="tool-btn pressable" data-tool="rect">▭ Rectangle</button><button class="tool-btn pressable" data-tool="ellipse">◯ Ellipse</button><button class="tool-btn pressable" data-tool="line">╱ Line</button><button class="tool-btn pressable" data-tool="arrow">→ Arrow</button><button class="tool-btn pressable" data-tool="text">T Text</button><button class="tool-btn pressable" data-tool="pen">✎ Pen</button><button class="tool-btn pressable" id="insert-image">▧ Image</button><span class="v-sep"></span><button class="tool-btn pressable" id="undo-btn">↶ Undo</button><button class="tool-btn pressable" id="redo-btn">↷ Redo</button><button class="tool-btn pressable" id="delete-shape">Delete</button></div></div></header>
<div id="workspace"><aside class="inspector" aria-label="Editor options"><h2>Page</h2><div class="row"><label for="page-width">W <input class="field" id="page-width" type="number" min="100" max="4000"/></label><label for="page-height">H <input class="field" id="page-height" type="number" min="100" max="4000"/></label></div><label class="check-row"><input type="checkbox" id="show-grid"/> Show grid</label><label class="check-row"><input type="checkbox" id="snap-grid"/> Snap to 10 px grid</label><h3>Selected object</h3><label for="shape-fill">Fill</label><input class="field" id="shape-fill" type="color"/><label for="shape-stroke">Outline</label><input class="field" id="shape-stroke" type="color"/><label for="stroke-width">Outline width</label><input class="field" id="stroke-width" type="number" min="0" max="30" step="0.5"/><label for="shape-text">Text</label><input class="field" id="shape-text" type="text"/><div class="row" style="margin-top:10px"><button class="small-btn" id="bring-forward">Bring forward</button><button class="small-btn" id="send-backward">Send back</button></div><h3>Layers</h3><div id="layers"></div></aside><div class="stage"><div class="graph-stage"><svg id="draw-canvas" class="paper" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Drawing canvas"></svg><p class="stage-caption">Drag to draw. Select an object to move it. Double click text to edit.</p></div></div></div></div></div><div class="toast hidden" id="toast" role="status"></div><script src="model.js"></script><script src="editor.js"></script><script src="shell.js"></script></body></html>
